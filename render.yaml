services:
  - type: web
    name: mediator-on-call
    runtime: python
    buildCommand: bash build.sh
    startCommand: gunicorn mediators_on_call.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DJANGO_SETTINGS_MODULE
        value: "mediators_on_call.settings"
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        value: "render-temp-secret-key-change-later"
      - key: DJANGO_ALLOWED_HOSTS
        value: "mediator-on-call.onrender.com,localhost,127.0.0.1"
    databases:
      - name: mediator-db
        databaseName: mediator_db
        user: mediator_user
        plan: free
